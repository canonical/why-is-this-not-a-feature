name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-go:
    runs-on: [self-hosted, noble, amd64]

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false

    - name: Install Go
      run: ./scripts/go/setup.sh

    - name: Run Go tests
      run: ./scripts/go/test.sh

    - name: Upload Go coverage report
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: coverage-report-go
        path: coverage/
        if-no-files-found: ignore
